<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>별자리가 보이는 밤 - Private Secret Space</title>
    <!-- PeerJS P2P 음성통화 라이브러리 -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body { 
            background-color: #0b111e; 
            color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
        }

        .app-container { 
            width: 100%; 
            max-width: 480px; 
            height: 92vh; 
            background: #17253d; 
            border: 2px solid #ffd166; 
            border-radius: 6px; 
            box-shadow: 0 0 25px rgba(255, 209, 102, 0.2); 
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow: hidden; 
        }

        .starry-header {
            background: linear-gradient(180deg, #070b14 0%, #111b2e 100%);
            border-bottom: 2px solid #ffd166;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .starry-title { display: flex; align-items: center; gap: 10px; }
        .star-icon { font-size: 24px; filter: drop-shadow(0 0 8px #ffd166); }
        .header-text h1 { font-size: 15px; color: #ffd166; font-weight: 700; letter-spacing: 1px; }
        .header-text p { font-size: 11px; color: #8da9c4; margin-top: 2px; }

        .header-actions { display: flex; gap: 8px; }
        
        .icon-btn { 
            background: #0b111e; 
            border: 1px solid #ffd166; 
            color: #ffd166; 
            width: 36px; 
            height: 36px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: #ffd166; color: #0b111e; }

        .call-bar {
            background: #111b2e;
            border-bottom: 2px solid #ffd166;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #ffd166;
        }

        .chat-box { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            background: #0b111e; 
        }

        .system-msg { 
            align-self: center; 
            font-size: 11px; 
            color: #ffd166; 
            background: #111b2e; 
            border: 1px solid #ffd166; 
            padding: 6px 14px; 
            border-radius: 4px; 
            text-align: center;
        }

        .msg-bubble { 
            max-width: 78%; 
            padding: 10px 14px; 
            border-radius: 6px; 
            font-size: 13px; 
            line-height: 1.4; 
            word-break: break-all; 
            position: relative;
        }

        .msg-bubble.me { 
            align-self: flex-end; 
            background: #ffd166; 
            color: #0b111e; 
            font-weight: 600; 
            border: 1px solid #ffc93c;
        }

        .msg-bubble.other { 
            align-self: flex-start; 
            background: #17253d; 
            color: #ffffff; 
            border: 1px solid #3d5a80; 
        }

        .msg-bubble img { max-width: 100%; border-radius: 4px; margin-top: 5px; }
        .msg-bubble a { color: #ffd166; text-decoration: underline; font-weight: bold; }

        .input-area { 
            padding: 12px 14px; 
            background: #111b2e; 
            border-top: 2px solid #ffd166; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
        }

        .input-area input[type="text"] { 
            flex: 1; 
            background: #0b111e; 
            color: #ffffff; 
            border: 1px solid #ffd166; 
            padding: 10px 14px; 
            border-radius: 4px; 
            outline: none; 
            font-size: 13px;
        }

        .square-btn { 
            background: #ffd166; 
            color: #0b111e; 
            border: 1px solid #ffd166; 
            font-weight: bold; 
            border-radius: 4px; 
            width: 38px; 
            height: 38px; 
            cursor: pointer; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .square-btn:hover { background: #ffc93c; }

        .send-btn { width: auto; padding: 0 16px; font-size: 13px; }

        .modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 17, 30, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            width: 100%;
            max-height: 85vh;
            background: #17253d;
            border: 2px solid #ffd166;
            border-radius: 6px; 
            padding: 20px;
            box-shadow: 0 0 20px rgba(255, 209, 102, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-card h3 { color: #ffd166; margin-bottom: 16px; font-size: 16px; text-align: center; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #8da9c4; margin-bottom: 4px; }
        .form-group input, .form-group textarea { 
            width: 100%; 
            background: #0b111e; 
            border: 1px solid #ffd166; 
            color: #fff; 
            padding: 8px 10px; 
            border-radius: 4px; 
            font-size: 13px;
        }
        .form-group textarea { resize: none; height: 50px; }

        .song-post-list { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            margin: 12px 0;
            padding-right: 4px;
        }

        .song-post-card { 
            background: #0b111e; 
            border: 1px solid #ffd166; 
            padding: 12px; 
            border-radius: 4px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }

        .song-post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #3d5a80;
            padding-bottom: 6px;
        }

        .song-title { font-size: 14px; font-weight: bold; color: #ffd166; }
        .song-artist { font-size: 12px; color: #8da9c4; }
        .song-writer { font-size: 10px; color: #ffd166; background: #111b2e; padding: 2px 6px; border-radius: 3px; border: 1px solid #ffd166; }
        .song-comment { font-size: 12px; color: #e0e6ed; line-height: 1.4; margin-top: 4px; word-break: break-all; }

        .hidden { display: none !important; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 헤더 -->
        <header class="starry-header">
            <div class="starry-title">
                <span class="star-icon">🌌</span>
                <div class="header-text">
                    <h1>별자리가 보이는 밤</h1>
                    <p id="user-info-text">별빛 아래 우리 둘만의 비밀 공간</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-call" title="음성통화">📞</button>
                <button class="icon-btn" id="btn-music" title="추천 노래 게시판">🎵</button>
                <button class="icon-btn" id="btn-settings" title="설정">⚙️</button>
            </div>
        </header>

        <!-- 음성 통화 바 -->
        <div id="call-bar" class="call-bar hidden">
            <span id="call-status">🎙️ 음성 연결 중...</span>
            <button class="square-btn send-btn" id="btn-end-call" style="background:#ff4b72; color:white; border-color:#ff4b72;">종료</button>
        </div>

        <!-- 채팅창 -->
        <div id="chat-box" class="chat-box">
            <div class="system-msg">✨ 비밀 방에 성공적으로 접속했습니다. 메시지를 입력해보세요!</div>
        </div>

        <!-- 하단 입력창 -->
        <footer class="input-area">
            <button class="square-btn" id="btn-add-file">+</button>
            <input type="file" id="file-input">

            <input type="text" id="msg-input" placeholder="별빛으로 전할 메시지...">

            <button class="square-btn" id="btn-star" title="별빛 반응">⭐</button>
            <button class="square-btn send-btn" id="btn-send">전송</button>
        </footer>

        <!-- 설정 모달 -->
        <div id="settings-modal" class="modal">
            <div class="modal-card">
                <h3>⚙️ 둘만의 프로필 설정</h3>
                <div class="form-group">
                    <label>내 닉네임</label>
                    <input type="text" id="setting-nickname" placeholder="닉네임 입력">
                </div>
                <div class="form-group">
                    <label>내 생일</label>
                    <input type="date" id="setting-birthday">
                </div>
                <button class="square-btn send-btn" id="btn-save-settings" style="width:100%; margin-top:10px;">저장 및 닫기</button>
            </div>
        </div>

        <!-- 노래 게시판 모달 -->
        <div id="music-modal" class="modal">
            <div class="modal-card">
                <h3>🎵 둘만의 추천 노래 게시판</h3>
                
                <div style="background: #0b111e; border: 1px solid #ffd166; padding: 10px; border-radius: 4px;">
                    <div class="form-group" style="margin-bottom:6px;">
                        <input type="text" id="song-title-input" placeholder="노래 제목 (예: 밤편지)">
                    </div>
                    <div class="form-group" style="margin-bottom:6px;">
                        <input type="text" id="song-artist-input" placeholder="가수 이름 (예: 아이유)">
                    </div>
                    <div class="form-group" style="margin-bottom:6px;">
                        <textarea id="song-comment-input" placeholder="추천 이유 또는 같이 듣고 싶은 한줄 글..."></textarea>
                    </div>
                    <button class="square-btn send-btn" id="btn-post-song" style="width:100%; margin-top:4px;">노래 게시하기 🎶</button>
                </div>

                <div id="song-post-list" class="song-post-list"></div>

                <button class="square-btn send-btn" id="btn-close-music" style="width:100%; margin-top:6px;">닫기</button>
            </div>
        </div>
    </div>

    <audio id="remote-audio" autoplay></audio>

    <!-- Firebase 및 애플리케이션 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://starry-chat-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const roomName = window.location.hash ? window.location.hash.substring(1) : "room2";
        const messagesRef = ref(db, 'rooms/' + roomName + '/messages');
        const songsRef = ref(db, 'rooms/' + roomName + '/songs');

        const myUserId = 'user_' + Math.random().toString(36).substr(2, 9);

        let userNickname = localStorage.getItem('star_nick') || "별빛탐험가";
        let userBirthday = localStorage.getItem('star_birth') || "";
        let songPosts = [];

        document.addEventListener('DOMContentLoaded', () => {
            const nickInput = document.getElementById('setting-nickname');
            const birthInput = document.getElementById('setting-birthday');
            if (nickInput) nickInput.value = userNickname;
            if (birthInput) birthInput.value = userBirthday;

            updateHeaderInfo();

            // 전송 버튼 클릭 및 엔터
            document.getElementById('btn-send').addEventListener('click', sendText);
            document.getElementById('msg-input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendText();
                }
            });

            // 파일 전송 버튼
            document.getElementById('btn-add-file').addEventListener('click', () => {
                document.getElementById('file-input').click();
            });
            document.getElementById('file-input').addEventListener('change', sendFile);

            // 별빛 반응 버튼
            document.getElementById('btn-star').addEventListener('click', sendReaction);

            // 모달 열고 닫기
            document.getElementById('btn-settings').addEventListener('click', () => {
                document.getElementById('settings-modal').classList.toggle('active');
            });
            document.getElementById('btn-save-settings').addEventListener('click', saveSettings);

            document.getElementById('btn-music').addEventListener('click', () => {
                document.getElementById('music-modal').classList.toggle('active');
            });
            document.getElementById('btn-close-music').addEventListener('click', () => {
                document.getElementById('music-modal').classList.remove('active');
            });
            document.getElementById('btn-post-song').addEventListener('click', postSong);

            // 통화 버튼
            document.getElementById('btn-call').addEventListener('click', toggleAudioCall);
            document.getElementById('btn-end-call').addEventListener('click', endCall);
        });

        // 메시지 동기화
        onChildAdded(messagesRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const isMe = data.userId === myUserId;
            if (data.type === 'text') {
                appendMsg((isMe ? "나: " : data.sender + ": ") + data.content, isMe ? 'me' : 'other');
            } else if (data.type === 'file') {
                appendFileMsg(isMe ? "나" : data.sender, data.fileName, data.fileData, isMe ? 'me' : 'other');
            } else if (data.type === 'reaction') {
                appendMsg("⭐ " + (isMe ? "내가" : data.sender + "님이") + " 반짝이는 별빛을 보냈습니다!", isMe ? 'me' : 'other');
            }
        });

        // 노래 동기화
        onValue(songsRef, (snapshot) => {
            const data = snapshot.val();
            songPosts = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    songPosts.unshift(data[key]);
                });
            }
            renderSongPosts();
        });

        function sendText() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (text) {
                push(messagesRef, {
                    type: 'text',
                    userId: myUserId,
                    sender: userNickname,
                    content: text,
                    timestamp: Date.now()
                });
                input.value = '';
            }
        }

        function sendFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 2 * 1024 * 1024) {
                alert("파일 크기는 2MB 이하만 전송 가능합니다.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                push(messagesRef, {
                    type: 'file',
                    userId: myUserId,
                    sender: userNickname,
                    fileName: file.name,
                    fileData: e.target.result,
                    timestamp: Date.now()
                });
            };
            reader.readAsDataURL(file);
        }

        function sendReaction() {
            push(messagesRef, {
                type: 'reaction',
                userId: myUserId,
                sender: userNickname,
                timestamp: Date.now()
            });
        }

        function postSong() {
            const titleInput = document.getElementById('song-title-input');
            const artistInput = document.getElementById('song-artist-input');
            const commentInput = document.getElementById('song-comment-input');

            const title = titleInput.value.trim();
            const artist = artistInput.value.trim();
            const comment = commentInput.value.trim();

            if (!title || !artist) {
                return alert("노래 제목과 가수를 입력해주세요!");
            }

            push(songsRef, {
                id: Date.now(),
                title: title,
                artist: artist,
                comment: comment || "이 노래 같이 들어요!",
                writer: userNickname
            });

            titleInput.value = '';
            artistInput.value = '';
            commentInput.value = '';
        }

        function renderSongPosts() {
            const container = document.getElementById('song-post-list');
            if (!container) return;
            container.innerHTML = '';

            if (songPosts.length === 0) {
                container.innerHTML = '<div style="text-align:center; font-size:12px; color:#8da9c4; padding:20px;">아직 게시된 추천 노래가 없습니다.<br>위 폼에서 둘만의 노래를 추가해 보세요!</div>';
                return;
            }

            songPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'song-post-card';
                card.innerHTML = `
                    <div class="song-post-header">
                        <div>
                            <div class="song-title">🎶 ${post.title}</div>
                            <div class="song-artist">${post.artist}</div>
                        </div>
                        <span class="song-writer">작성자: ${post.writer}</span>
                    </div>
                    <div class="song-comment">💬 ${post.comment}</div>
                `;
                container.appendChild(card);
            });
        }

        function appendMsg(msg, type) {
            const box = document.getElementById('chat-box');
            if (!box) return;
            const div = document.createElement('div');
            div.className = type === 'system' ? 'system-msg' : `msg-bubble ${type}`;
            div.innerText = msg;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function appendFileMsg(sender, fileName, fileData, type) {
            const box = document.getElementById('chat-box');
            if (!box) return;
            const div = document.createElement('div');
            div.className = `msg-bubble ${type}`;
            
            if (fileData.startsWith('data:image')) {
                div.innerHTML = `${sender}: <br><img src="${fileData}" alt="${fileName}">`;
            } else {
                div.innerHTML = `${sender}: <br><a href="${fileData}" download="${fileName}">📎 ${fileName}</a>`;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function saveSettings() {
            const nick = document.getElementById('setting-nickname').value || "별빛탐험가";
            const birth = document.getElementById('setting-birthday').value;
            userNickname = nick;
            userBirthday = birth;
            localStorage.setItem('star_nick', nick);
            localStorage.setItem('star_birth', birth);
            updateHeaderInfo();
            document.getElementById('settings-modal').classList.remove('active');
        }

        function updateHeaderInfo() {
            let birthText = userBirthday ? ` | 🎂 ${userBirthday}` : '';
            const el = document.getElementById('user-info-text');
            if (el) el.innerText = `${userNickname}님${birthText}`;
        }

        // WebRTC 음성 통화
        let localStream = null;
        let currentCall = null;
        let peer = null;

        function toggleAudioCall() {
            if (!peer) {
                const callPeerId = roomName + '_' + (Math.random() > 0.5 ? 'userA' : 'userB');
                peer = new Peer(callPeerId);
            }

            navigator.mediaDevices.getUserMedia({ audio: true, video: false })
                .then(stream => {
                    localStream = stream;
                    showCallBar("🎙️ 상대방 통화 연결 대기 중...");
                    const targetId = roomName + '_' + (peer.id.endsWith('userA') ? 'userB' : 'userA');
                    const call = peer.call(targetId, stream);
                    
                    if (call) {
                        call.on('stream', remoteStream => {
                            document.getElementById('remote-audio').srcObject = remoteStream;
                            showCallBar("🎙️ 음성 통화 중");
                        });
                        currentCall = call;
                    }
                })
                .catch(err => alert("마이크 권한 요청 승인이 필요합니다."));
        }

        function endCall() {
            if (currentCall) currentCall.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            document.getElementById('call-bar').classList.add('hidden');
        }

        function showCallBar(text) {
            document.getElementById('call-bar').classList.remove('hidden');
            document.getElementById('call-status').innerText = text;
        }
    </script>
</body>
</html>
