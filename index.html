<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

        /* 1. 연남색 다크모드 배경 */
        body { 
            background-color: #0b111e; 
            color: #f0f4f8; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden;
        }

        /* 2. 메인 컨테이너 (네모네모 모서리 & 노란색 테두리) */
        .app-container { 
            width: 100%; 
            max-width: 480px; 
            height: 92vh; 
            background: #17253d; 
            border: 2px solid #ffd166; 
            border-radius: 6px; 
            box-shadow: 0 0 25px rgba(255, 209, 102, 0.2); 
            display: flex; 
            flex-direction: column; 
            position: relative;
            overflow: hidden; 
        }

        /* 별자리가 보이는 밤 테마 헤더 */
        .starry-header {
            background: linear-gradient(180deg, #070b14 0%, #111b2e 100%);
            border-bottom: 2px solid #ffd166;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .starry-title { display: flex; align-items: center; gap: 10px; }
        .star-icon { font-size: 26px; filter: drop-shadow(0 0 8px #ffd166); }
        .header-text h1 { font-size: 16px; color: #ffd166; font-weight: 700; letter-spacing: 1px; }
        .header-text p { font-size: 11px; color: #8da9c4; margin-top: 2px; }

        .header-actions { display: flex; gap: 8px; }
        
        /* 네모네모 아이콘 버튼 */
        .icon-btn { 
            background: #0b111e; 
            border: 1px solid #ffd166; 
            color: #ffd166; 
            width: 38px; 
            height: 38px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .icon-btn:hover { background: #ffd166; color: #0b111e; }
